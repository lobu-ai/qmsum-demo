# lobu.toml — QMSum agent demo.
#
# Single-agent project: a `qmsum` research assistant grounded in the Yale-LILY
# QMSum meeting transcripts (Academic / Product / Committee). The QMSum data is
# ingested via the custom connector at ./connectors/qmsum.connector.ts; agent
# prompts and evals live under ./agents/qmsum/.
#
# Run order (see README.md for the full walkthrough):
#   1. cp .env.example .env  + fill in keys
#   2. bun install
#   3. lobu run                   # local gateway + worker
#   4. lobu apply                 # creates org, entities, connector definition
#   5. lobu connector run qmsum-transcripts   # self-fetches QMSum from GitHub
#   6. (optional, only for the eval pipeline) make clone-data
#   7. bun run prepare-fixtures && bun run evals

[agents.qmsum]
name = "qmsum"
description = "Research assistant grounded in QMSum meeting transcripts (Academic, Product, Committee)."
dir = "./agents/qmsum"

# Anthropic via OpenRouter — swap in any provider/model in your install.
# claude-haiku-4-5-20251001 is also the default rubric grader configured in
# the promptfoo config below, so single-provider installs work out of the box.
[[agents.qmsum.providers]]
id = "anthropic"
model = "claude-haiku-4-5-20251001"
key = "$ANTHROPIC_API_KEY"

[memory]
enabled = true
org = "qmsum-demo"
name = "QMSum demo"
description = "Yale-LILY QMSum meeting transcripts indexed for grounded Q&A and summarization."
models = "./models"
data = "./data"
