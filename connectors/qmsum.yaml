# QMSum meeting-transcript connection — backed by ./qmsum.connector.ts.
#
# Self-sufficient: the connector fetches the Yale-LILY QMSum corpus directly
# from GitHub via @lobu/connector-sdk's FileSystemSource primitive on first
# sync. No manual `git clone` is required — a shallow cache lives under
# `${WORKSPACE_DIR}/.lobu-cache/sources/` and is reused across syncs.
#
# A single `transcripts` feed walks data/{Academic,Product,Committee}/
# (using the first non-empty split per domain, preferring test → val → train),
# merges consecutive same-speaker turns into one event each, and emits per-
# domain speaker identities according to the rules in models/schema.yaml.
#
# Schedule is a once-a-year cron (Jan 1 at 00:00 on Sunday) — `cron-parser`
# has no `@once` macro, so this is the closest "effectively manual" cron the
# server will accept. QMSum is a static dataset; if you bump
# `per_domain_limit`, re-apply and trigger the sync from the dashboard
# (admin `trigger_feed` action) rather than waiting for the schedule.
#
# `per_domain_limit` lives only on the feed — the server rejects
# feed-scoped keys at connection-level with "Feed-scoped config belongs on
# feeds." (see splitConfigByFeedScope in packages/server).
---
version: 1
type: connection
slug: qmsum-transcripts
connector: qmsum
name: QMSum meeting transcripts
feeds:
  - feed: transcripts
    name: Meeting transcripts
    schedule: "0 0 1 1 0"
    config:
      per_domain_limit: 10
