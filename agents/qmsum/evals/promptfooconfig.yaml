# QMSum agent evals — driven by promptfoo + @lobu/promptfoo-provider.
#
# Quick start (from the repo root):
#   bun install
#   export LOBU_TOKEN=$(lobu token)
#   bun run prepare-fixtures   # writes .eval-fixtures/{specific,general,attribution,cross-meeting,retrieval-recall}.jsonl
#   bun run evals
#   bun run evals:view
#
# Each JSONL fixture is its own "scenario" — the rows carry their own
# `assert` blocks, so the asserts differ per file:
#
#   .eval-fixtures/specific.jsonl         — answer-quality (llm-rubric vs gold)
#   .eval-fixtures/general.jsonl          — meeting-summary (llm-rubric + answer-relevance)
#   .eval-fixtures/attribution.jsonl      — speaker-attribution (icontains)
#   .eval-fixtures/cross-meeting.jsonl    — hand-authored multi-meeting synthesis (llm-rubric)
#   .eval-fixtures/retrieval-recall.jsonl — turn-overlap.js judge + context-recall + context-faithfulness
#
# The retrieval-recall scenario relies on the gateway's `tool_use` SSE
# event — the provider surfaces it as `metadata.toolCalls` and the joined
# snippet text as `metadata.retrievedContext`, which is what the
# `contextTransform:` fields below read.

description: QMSum agent evals

providers:
  - id: 'package:@lobu/promptfoo-provider:LobuProvider'
    config:
      agent: qmsum
      # gateway: http://localhost:8787   # default; override via LOBU_GATEWAY
      # token:   ...                     # required via LOBU_TOKEN env

defaultTest:
  options:
    provider: anthropic:messages:claude-haiku-4-5-20251001

prompts:
  - '{{query}}'

tests:
  - file://../../../.eval-fixtures/specific.jsonl
  - file://../../../.eval-fixtures/general.jsonl
  - file://../../../.eval-fixtures/attribution.jsonl
  - file://../../../.eval-fixtures/cross-meeting.jsonl
  - file://../../../.eval-fixtures/retrieval-recall.jsonl
